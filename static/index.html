<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>联营周转餐盒服务</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; }
    body { margin: 0; background: #f6f7f9; color: #17202a; }
    header { background: #0f5132; color: white; padding: 20px 28px; }
    header h1 { margin: 0 0 6px; font-size: 24px; }
    header p { margin: 0; opacity: .86; }
    main { max-width: 1280px; margin: 24px auto; padding: 0 20px 60px; display: grid; gap: 18px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 18px; }
    section.card { background: white; border: 1px solid #dde3e8; border-radius: 12px; padding: 18px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    h2 { margin-top: 0; font-size: 18px; }
    label { display: block; font-size: 13px; color: #4b5563; margin: 10px 0 4px; }
    input, select { width: 100%; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 8px; padding: 9px 10px; font-size: 14px; }
    button { border: 0; border-radius: 8px; padding: 9px 14px; background: #0f7a4d; color: white; font-weight: 650; cursor: pointer; margin-top: 12px; }
    button.secondary { background: #334155; }
    button.warn { background: #b45309; }
    button:hover { filter: brightness(.96); }
    pre { background: #0b1220; color: #dbeafe; padding: 14px; border-radius: 10px; overflow: auto; max-height: 430px; font-size: 12px; line-height: 1.45; }
    .hint { font-size: 12px; color: #64748b; margin-top: 8px; }
    .pill { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 12px; background: #e2e8f0; margin: 2px 4px 2px 0; }
    .pill.ok { background: #dcfce7; color: #166534; }
    .pill.bad { background: #fee2e2; color: #991b1b; }
    .pill.hold { background: #fef3c7; color: #92400e; }
    .row { border-top: 1px solid #edf2f7; padding: 10px 0; }
    .row:first-child { border-top: 0; }
    .muted { color: #64748b; font-size: 13px; }
  </style>
</head>
<body>
<header>
  <h1>联营周转餐盒与跨点退押服务</h1>
  <p>同一套业务视图服务顾客、领用门店、还盒点和管理端；金额单位为整数分。</p>
</header>
<main>
  <div class="grid">
    <section class="card">
      <h2>顾客查询</h2>
      <label for="customerId">顾客编号</label>
      <input id="customerId" value="guest-a" />
      <button onclick="loadCustomer()">查询我的每只盒 / 退款</button>
      <div class="hint">可试 guest-a（含争议与已到账退款）、guest-b。</div>
      <div id="customerSummary"></div>
      <pre id="customerOut">等待查询…</pre>
    </section>

    <section class="card">
      <h2>领用门店 / 代收门店</h2>
      <label for="merchantId">商户编号或收盒点编号</label>
      <input id="merchantId" value="hot-c" />
      <button onclick="loadMerchant()">查押金、应退与代收款</button>
      <div class="hint">可试 hot-a、hot-b、hot-c、hot-d、auto-4。</div>
      <div id="merchantSummary"></div>
      <pre id="merchantOut">等待查询…</pre>
    </section>

    <section class="card">
      <h2>实物追踪</h2>
      <label for="boxId">盒号</label>
      <input id="boxId" value="box7" />
      <button onclick="loadBox()">追到在途 / 待清洗 / 可借</button>
      <div class="hint">可试 box7、box8。</div>
      <div id="boxSummary"></div>
      <pre id="boxOut">等待查询…</pre>
    </section>
  </div>

  <section class="card">
    <h2>管理端：争议、核实与月末结算</h2>
    <button class="secondary" onclick="loadAdmin()">刷新管理总览</button>
    <label for="period">结算月份</label>
    <input id="period" value="2026-11" />
    <button onclick="settlePeriod()">生成/定稿月度服务费结算</button>
    <div id="adminSummary"></div>
    <pre id="adminOut">点击“刷新管理总览”加载争议和数据。</pre>
  </section>
</main>

<script>
async function getJSON(url) {
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || res.statusText);
  return data;
}
async function postJSON(url, body) {
  const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {})});
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || res.statusText);
  return data;
}
function show(id, data) { document.getElementById(id).textContent = JSON.stringify(data, null, 2); }
function pill(text, cls) { return `<span class="pill ${cls || ''}">${text}</span>`; }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function loadCustomer() {
  const id = document.getElementById('customerId').value.trim();
  try {
    const data = await getJSON('/api/customers/' + encodeURIComponent(id));
    document.getElementById('customerSummary').innerHTML = data.boxes.map(b => `
      <div class="row">
        <strong>${esc(b.box)}</strong> / 租次 ${esc(b.issue)}
        <div>${pill(b.refund_status_zh || b.refund_status, b.refund_status === 'settled' ? 'ok' : (b.dispute_id ? 'hold' : ''))}
             ${pill('资格：' + b.eligibility_status, b.eligibility_status.startsWith('eligible') ? 'ok' : 'hold')}
             ${b.dispute_id ? pill('争议 ' + b.dispute_id, 'bad') : ''}</div>
        <div class="muted">押金 ${b.deposit} 分；应退 ${b.refund_due} 分；已到账 ${b.settled_amount} 分</div>
      </div>`).join('');
    show('customerOut', data);
  } catch (e) { document.getElementById('customerOut').textContent = e.message; }
}

async function loadMerchant() {
  const id = document.getElementById('merchantId').value.trim();
  try {
    const data = await getJSON('/api/merchants/' + encodeURIComponent(id));
    const f = data.collection_fees;
    document.getElementById('merchantSummary').innerHTML = `
      <div class="row">${pill('收押金 ' + data.deposits_received.amount + ' 分', 'ok')}
        ${pill('应退 ' + data.refunds.due_amount + ' 分')}
        ${pill('已退 ' + data.refunds.settled_amount + ' 分', 'ok')}</div>
      <div class="row">${pill('应付服务费 ' + f.payable_ready, 'bad')}
        ${pill('应收服务费 ' + f.receivable_ready, 'ok')}
        ${pill('争议/挂起 ' + f.disputed_or_held, 'hold')}</div>
      <div class="muted">代其他店点验 ${data.collections_on_behalf_of_other_stores.length} 笔；保管盒 ${data.custody_boxes.length} 只。</div>`;
    show('merchantOut', data);
  } catch (e) { document.getElementById('merchantOut').textContent = e.message; }
}

async function loadBox() {
  const id = document.getElementById('boxId').value.trim();
  try {
    const data = await getJSON('/api/boxes/' + encodeURIComponent(id));
    document.getElementById('boxSummary').innerHTML = `
      <div class="row"><strong>${esc(data.box)}</strong> ${pill(data.status_zh, data.rentable ? 'ok' : 'hold')}
        ${data.custody_disputed ? pill('保管争议 ' + data.open_dispute_id, 'bad') : ''}</div>
      <div class="muted">当前保管人：${esc(data.custodian || '未知')}；位置：${esc(data.location || '未知')}；可借：${data.rentable ? '是' : '否'}</div>`;
    show('boxOut', data);
  } catch (e) { document.getElementById('boxOut').textContent = e.message; }
}

async function loadAdmin() {
  try {
    const data = await getJSON('/api/admin/overview');
    document.getElementById('adminSummary').innerHTML = `
      <div class="row">${Object.entries(data.counts).map(([k,v]) => pill(k + '=' + v)).join('')}</div>
      ${data.disputes.map(d => `<div class="row">
        <strong>${esc(d.id)}</strong> ${pill(d.status, d.status === 'open' ? 'bad' : 'ok')}<br/>
        <span class="muted">盒 ${esc(d.box)}；相关门店 ${d.merchants.map(esc).join(', ')}；顾客 ${d.customers.map(esc).join(', ')}</span><br/>
        ${d.claims.map(c => `<button class="warn" onclick="resolveDispute('${d.id}','${c.point}/${c.event}')">核实并支持 ${esc(c.point)}/${esc(c.event)}</button>`).join(' ')}
      </div>`).join('')}`;
    show('adminOut', data);
  } catch (e) { document.getElementById('adminOut').textContent = e.message; }
}

async function resolveDispute(id, claim) {
  try { await postJSON(`/api/disputes/${encodeURIComponent(id)}/resolve`, {claim, resolved_by: 'web-admin'}); await loadAdmin(); }
  catch (e) { document.getElementById('adminOut').textContent = e.message; }
}
async function settlePeriod() {
  const period = document.getElementById('period').value.trim();
  try { const data = await postJSON('/api/settlements', {period, finalize: true}); show('adminOut', data); loadAdmin(); }
  catch (e) { document.getElementById('adminOut').textContent = e.message; }
}
loadCustomer(); loadBox();
</script>
</body>
</html>
